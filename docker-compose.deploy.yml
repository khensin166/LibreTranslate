services:
  libretranslate:
    container_name: libretranslate
    image: ${IMAGE_NAME:-ghcr.io/khensin166/libretranslate:latest}
    restart: unless-stopped
    ports:
      - "${LIBRETRANSLATE_PORT:-5000}:5000"
    environment:
      # Language Restriction: Only load Indonesian (id) & English (en)
      - LT_LOAD_ONLY=id,en
      - LT_UPDATE_MODELS=true

      # Resource Optimization: Limit threads & memory footprint
      - LT_THREADS=2
      - LT_SUGGESTIONS=false
      - LT_DISABLE_WEB_UI=false
      
      # Safety Limits: Protect VPS memory against abusive payloads
      - LT_CHAR_LIMIT=5000
      - LT_REQ_LIMIT=120
      - LT_BATCH_LIMIT=20

      # Optional API Key enforcement (uncomment if you want to require API keys)
      # - LT_API_KEYS=false
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1200M
        reservations:
          memory: 512M
    volumes:
      # Keep language models permanently cached so they are never re-downloaded
      - libretranslate_models:/home/libretranslate/.local:rw
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  libretranslate_models:
    name: libretranslate_models

